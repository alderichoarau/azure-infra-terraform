# -----------------------------------------------------------------------------------------------
# CI only (no CD) -- mirrors the validate/security checks from .github/workflows/ci.yml (fmt,
# terraform validate, Checkov). The plan/apply jobs stay on GitHub only, since they need Azure
# OIDC credentials that are not duplicated onto GitLab. tflint is intentionally left out here: it
# needs a GITHUB_TOKEN to avoid GitHub API rate limits when fetching plugins, which this pipeline
# doesn't have. Jobs are split into .gitlab/ci/, one file per stage, mirroring the .github/workflows
# layout.
# -----------------------------------------------------------------------------------------------
stages:
  - validate
  - security

include:
  - local: .gitlab/ci/validate.yml
  - local: .gitlab/ci/security.yml
