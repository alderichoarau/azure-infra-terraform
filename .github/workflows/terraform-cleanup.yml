name: Terraform Weekly Cleanup
run-name: "Cleanup · destroy · ${{ github.event_name == 'schedule' && 'scheduled' || format('triggered by @{0}', github.actor) }}"

on:
  # schedule:
  # Fridays 18:00 Europe/Paris = 16:00 UTC (summer/CEST).
  # Cron is always UTC and does not follow DST — in winter (CET) this fires at 17:00 Paris time instead of 18:00.
  # - cron: "0 16 * * 5"
  workflow_dispatch: {}

# Destroys every per-student directory this learner might have applied,
# in reverse dependency order: terraform-python / terraform-managed-services
# / terraform-aks-app first (they read terraform-core's remote state, so
# destroying core first would leave them pointing at a state that no longer
# exists), then terraform-core last. Each directory is destroyed even if it
# was never applied -- `terraform destroy` on an empty state is a no-op, so
# this doesn't need to know in advance which tracks a given learner enabled.
#
# Deliberately does NOT touch terraform-shared-aks / terraform-shared-plan
# (trainer-side, shared across the whole cohort -- a weekly per-student
# cleanup must never be able to reach them) or terraform-prometheus (its own
# lifecycle, see that directory's README on why it's meant to stay up once
# enabled rather than getting swept by this weekly job).

permissions:
  id-token: write # OIDC token for Azure login
  contents: read

env:
  TF_VERSION: "~> 1.9"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
  TF_VAR_automation_only: "true"
  TF_VAR_owner: ${{ secrets.AZURE_OWNER }}
  TF_VAR_resource_group_name: ${{ secrets.AZURE_RG_NAME }}
  TF_VAR_alert_email: ${{ secrets.AZURE_ALERT_EMAIL }}

jobs:
  destroy:
    name: Terraform Destroy (weekly cleanup)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Destroy each directory (reverse dependency order)
        run: |
          SUMMARY_FILE="$RUNNER_TEMP/summary.md"
          echo "## Terraform Weekly Cleanup" > "$SUMMARY_FILE"
          echo "- **Owner**   : ${{ secrets.AZURE_OWNER }}" >> "$SUMMARY_FILE"
          echo "- **Trigger** : ${{ github.event_name }}" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"

          STATUS=0
          for dir in terraform-aks-app terraform-managed-services terraform-python terraform-core; do
            echo "──────────────────────────────────────────────"
            echo "→ $dir : terraform destroy"
            echo "──────────────────────────────────────────────"
            (
              cd "$dir"
              set -e
              terraform init -input=false
              terraform destroy -input=false -auto-approve -no-color
            )
            RC=$?
            if [ "$RC" -eq 0 ]; then
              echo "- ✅ \`$dir\`: destroyed (or already empty)" >> "$SUMMARY_FILE"
            else
              echo "- ❌ \`$dir\`: destroy FAILED (exit $RC) — stopping, later directories skipped" >> "$SUMMARY_FILE"
              STATUS=1
              break
            fi
          done

          cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS
