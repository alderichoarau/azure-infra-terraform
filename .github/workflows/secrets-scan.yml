# -----------------------------------------------------------------------------------------------
# Secrets scanning: catches credentials committed by mistake (a real risk here specifically --
# .tfvars pasted with a live value, a service principal secret dropped in during debugging), in
# the diff and past history. Same job as azure-quiz-backend's/azure-quiz-frontend's; this repo has
# no equivalent yet even though it's the one holding every Azure OIDC/subscription identifier.
# Complements (doesn't replace) GitHub's native secret scanning if enabled at org level.
# -----------------------------------------------------------------------------------------------
name: Terraform Secrets Scan
run-name: "Secrets Scan · gitleaks · ${{ github.ref_name }} by @${{ github.actor }}"

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: "Scan for leaked secrets"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so gitleaks can scan past commits too

      - name: "Scan for leaked secrets (gitleaks)"
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
