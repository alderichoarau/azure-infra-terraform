# ─────────────────────────────────────────────────────────────────────────────
# CI equivalent of scripts/bootstrap-aks-namespace.sh — same logic, run
# without needing az/kubectl installed locally. Trainer-only tooling: creates
# one learner's namespace on the shared AKS cluster and grants their
# ci_app_deploy identity a role scoped to just that namespace. See that
# script's header comment (and terraform-shared-aks/README.md) for why this
# can't be self-service from a learner's own Terraform.
# ─────────────────────────────────────────────────────────────────────────────
name: Bootstrap AKS Namespace
run-name: "Bootstrap AKS namespace · ${{ inputs.owner }} · @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      owner:
        description: "Learner identifier (matches their var.owner) — becomes the namespace name"
        required: true
        type: string
      principal_id:
        description: "Object ID (not client ID) of their ci_app_deploy identity — from `terraform output ci_app_deploy_principal_id` in their own apply"
        required: true
        type: string
      environment:
        description: "Which shared cluster"
        required: true
        type: choice
        options:
          - nonprod
          - prod

permissions:
  id-token: write
  contents: read

env:
  SHARED_RG: rg-shared-prf2026
  AKS_CLUSTER: aks-${{ inputs.environment }}-prf2026

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: "Azure Login (OIDC)"
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: "Install kubectl"
        # --kubelogin-version pinned: unpinned, this calls GitHub's
        # unauthenticated releases/latest API (60 req/hour per IP, shared
        # across every GitHub-hosted runner) and intermittently fails with
        # "403 rate limit exceeded" -- hit live on the app repos' aks-deploy.yml.
        run: az aks install-cli --kubelogin-version v0.2.19

      - name: "Get AKS admin credentials"
        run: |
          az aks get-credentials \
            --resource-group "$SHARED_RG" \
            --name "$AKS_CLUSTER" \
            --admin \
            --overwrite-existing

      - name: "Create namespace (idempotent)"
        run: |
          kubectl create namespace "${{ inputs.owner }}" --dry-run=client -o yaml | kubectl apply -f -

      - name: "Grant cluster-level + namespace-scoped Azure RBAC roles"
        run: |
          CLUSTER_ID=$(az aks show --resource-group "$SHARED_RG" --name "$AKS_CLUSTER" --query id -o tsv)

          # ARM-level role, scoped to the cluster itself -- separate layer
          # from the Kubernetes-authorization role below. Without this,
          # `az aks get-credentials` (no --admin, deploy-aks.yml) fails with
          # AuthorizationFailed on listClusterUserCredential/action before
          # kubectl even gets a chance to hit the Kubernetes API at all. This
          # role only grants "can fetch a non-admin kubeconfig" -- it grants
          # zero Kubernetes API access on its own, that's still entirely
          # controlled by the namespace-scoped role below.
          az role assignment create \
            --role "Azure Kubernetes Service Cluster User Role" \
            --scope "$CLUSTER_ID" \
            --assignee-object-id "${{ inputs.principal_id }}" \
            --assignee-principal-type ServicePrincipal

          # Kubernetes-authorization layer (Azure RBAC for Kubernetes,
          # azure_rbac_enabled = true on the cluster) -- controls what this
          # identity can actually do once it has a kubeconfig, scoped to just
          # this one namespace.
          az role assignment create \
            --role "Azure Kubernetes Service RBAC Admin" \
            --scope "${CLUSTER_ID}/namespaces/${{ inputs.owner }}" \
            --assignee-object-id "${{ inputs.principal_id }}" \
            --assignee-principal-type ServicePrincipal

          # Read-only, scoped to app-routing-system -- deploy-aks.yml's
          # "Resolve ingress public IP" step needs to `kubectl get svc` in
          # this *other* shared namespace (the App Routing add-on's ingress
          # controller lives there, terraform-shared-aks/main.tf's
          # web_app_routing block) to discover the ingress IP. Without this,
          # that step gets a 403 from every namespace-scoped identity, which
          # its retry loop was silently swallowing as "not ready yet" and
          # burning the full 5-minute timeout before failing -- hit live.
          az role assignment create \
            --role "Azure Kubernetes Service RBAC Reader" \
            --scope "${CLUSTER_ID}/namespaces/app-routing-system" \
            --assignee-object-id "${{ inputs.principal_id }}" \
            --assignee-principal-type ServicePrincipal

      - name: "Job summary"
        if: always()
        run: |
          echo "## Bootstrap AKS namespace" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Owner** : ${{ inputs.owner }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Cluster** : $AKS_CLUSTER" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Principal ID** : ${{ inputs.principal_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Actor** : @${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
