# -----------------------------------------------------------------------------------------------
# FinOps: stops the prod Postgres Flexible Server overnight (compute isn't billed while stopped,
# only storage) and starts it back up in the morning.
#
# The backend App Service is stopped/started in lockstep -- not for its own billing (an App
# Service Plan bills hourly regardless of whether the app inside is running, so stopping it alone
# buys nothing) but so the frontend gets a clean, detectable "backend unreachable" signal during
# this window instead of confusing errors against a dead Postgres -- see
# BackendAvailabilityService (azure-quiz-frontend) which shows a dedicated banner for it.
#
# Cron is always UTC and does not follow DST -- times below are 19:00/05:00 Europe/Paris in
# summer (CEST, UTC+2); in winter (CET) this fires an hour later Paris time. Same tradeoff already
# accepted in terraform-cleanup.yml's schedule.
#
# -----------------------------------------------------------------------------------------------
name: "FinOps - Postgres nightly stop/start (prod)"
run-name: "FinOps · Postgres · ${{ github.event_name == 'workflow_dispatch' && inputs.action || (github.event.schedule == '00 17 * * *' && 'stop' || 'start') }}"

on:
  schedule:
    - cron: "00 17 * * *" # 19:00 Europe/Paris (CEST)
    - cron: "0 3 * * *" # 05:00 Europe/Paris (CEST)
  workflow_dispatch:
    inputs:
      action:
        required: true
        type: choice
        options:
          - stop
          - start

permissions:
  id-token: write
  contents: read

env:
  ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || (github.event.schedule == '00 17 * * *' && 'stop' || 'start') }}

jobs:
  postgres-schedule:
    runs-on: ubuntu-latest
    environment: prod
    env:
      AZURE_RG_NAME: ${{ secrets.AZURE_RG_NAME }}
      AZURE_OWNER: ${{ secrets.AZURE_OWNER }}
    steps:
      - name: "Azure Login (OIDC)"
        uses: alderichoarau/gha-azure-login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: "Find Postgres server by tag"
        id: find-pg
        run: |
          NAME=$(az resource list \
            --resource-group "$AZURE_RG_NAME" \
            --query "[?type=='Microsoft.DBforPostgreSQL/flexibleServers' && tags.owner=='$AZURE_OWNER' && tags.environment=='prod'].name | [0]" \
            -o tsv)
          if [ -z "$NAME" ]; then
            echo "::error::No Postgres Flexible Server found (owner=$AZURE_OWNER, environment=prod)."
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: "Find App Service by tag"
        id: find-app
        run: |
          NAME=$(az resource list \
            --resource-group "$AZURE_RG_NAME" \
            --query "[?type=='Microsoft.Web/sites' && tags.component=='quiz-backend' && tags.owner=='$AZURE_OWNER' && tags.environment=='prod'].name | [0]" \
            -o tsv)
          if [ -z "$NAME" ]; then
            echo "::error::No backend App Service found (owner=$AZURE_OWNER, environment=prod)."
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Stop order: App Service first, then Postgres -- so the app isn't left serving requests
      # against a DB that's already going down mid-request.
      - name: "Stop App Service"
        if: env.ACTION == 'stop'
        run: az webapp stop --name "${{ steps.find-app.outputs.name }}" --resource-group "$AZURE_RG_NAME"

      - name: "Stop Postgres"
        if: env.ACTION == 'stop'
        run: az postgres flexible-server stop --name "${{ steps.find-pg.outputs.name }}" --resource-group "$AZURE_RG_NAME"

      # Start order: Postgres first (and wait for it), then App Service -- so the app's first
      # requests after starting don't hit a DB that isn't ready yet.
      - name: "Start Postgres"
        if: env.ACTION == 'start'
        run: az postgres flexible-server start --name "${{ steps.find-pg.outputs.name }}" --resource-group "$AZURE_RG_NAME"

      - name: "Wait for Postgres to be Ready"
        if: env.ACTION == 'start'
        run: |
          for i in $(seq 1 30); do
            STATE=$(az postgres flexible-server show --name "${{ steps.find-pg.outputs.name }}" --resource-group "$AZURE_RG_NAME" --query state -o tsv)
            [ "$STATE" = "Ready" ] && exit 0
            sleep 10
          done
          echo "::error::Postgres did not reach 'Ready' within 5 minutes."
          exit 1

      - name: "Start App Service"
        if: env.ACTION == 'start'
        run: az webapp start --name "${{ steps.find-app.outputs.name }}" --resource-group "$AZURE_RG_NAME"

      - name: "Job summary"
        if: always()
        run: |
          echo "## FinOps · ${{ env.ACTION }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Postgres server** : ${{ steps.find-pg.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **App Service** : ${{ steps.find-app.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger** : ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
