name: Terraform Deploy
run-name: "Deploy · ${{ inputs.action }} · triggered by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to execute"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
      prometheus_vm_size:
        description: "Prometheus VM size — B-series is blocked on this subscription (capacity/NotAvailableForSubscription in francecentral), default is D2s_v3"
        required: false
        type: string
        default: "Standard_D2s_v3"
      enable_prometheus_stack:
        description: "Provision the Prometheus/Grafana stack (VM, Azure Monitor Workspace, Managed Grafana, alert rule group — observability-prometheus.tf)? Off by default while iterating on the TP Java/Angular track, to avoid recreating it on every apply/destroy cycle."
        required: false
        type: boolean
        default: false

permissions:
  id-token: write  # OIDC token for Azure login
  contents: read

env:
  TF_VERSION:              "~> 1.9"
  ARM_USE_OIDC:            "true"
  ARM_CLIENT_ID:           ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID:           ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID:     ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_WORKING_DIR:          terraform
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
  TF_VAR_automation_only:  "true"

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      # ── Setup ────────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Init & Validate ───────────────────────────────────────────────────────
      # State + run history live in HCP Terraform (see terraform/backend.tf);
      # plan/apply still execute here since the workspace execution-mode is "local".
      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        run: terraform validate

      # ── Plan ─────────────────────────────────────────────────────────────────
      - name: Terraform Plan
        if: inputs.action == 'plan'
        run: |
          terraform plan \
            -input=false \
            -var="owner=${{ secrets.AZURE_OWNER }}" \
            -var="resource_group_name=${{ secrets.AZURE_RG_NAME }}" \
            -var="alert_email=${{ secrets.AZURE_ALERT_EMAIL }}" \
            -var="trainer_ip_cidr=${{ secrets.TRAINER_IP_CIDR }}" \
            -var="prometheus_vm_size=${{ inputs.prometheus_vm_size }}" \
            -var="enable_prometheus_stack=${{ inputs.enable_prometheus_stack }}" \
            -out=tfplan \
            -no-color \
            | tee plan_output.txt

      # ── Apply ─────────────────────────────────────────────────────────────────
      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: |
          terraform apply \
            -input=false \
            -var="owner=${{ secrets.AZURE_OWNER }}" \
            -var="resource_group_name=${{ secrets.AZURE_RG_NAME }}" \
            -var="alert_email=${{ secrets.AZURE_ALERT_EMAIL }}" \
            -var="trainer_ip_cidr=${{ secrets.TRAINER_IP_CIDR }}" \
            -var="prometheus_vm_size=${{ inputs.prometheus_vm_size }}" \
            -var="enable_prometheus_stack=${{ inputs.enable_prometheus_stack }}" \
            -auto-approve \
            -no-color \
            | tee apply_output.txt

      # ── Destroy ───────────────────────────────────────────────────────────────
      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        run: |
          terraform destroy \
            -input=false \
            -var="owner=${{ secrets.AZURE_OWNER }}" \
            -var="resource_group_name=${{ secrets.AZURE_RG_NAME }}" \
            -var="alert_email=${{ secrets.AZURE_ALERT_EMAIL }}" \
            -var="trainer_ip_cidr=${{ secrets.TRAINER_IP_CIDR }}" \
            -var="prometheus_vm_size=${{ inputs.prometheus_vm_size }}" \
            -var="enable_prometheus_stack=${{ inputs.enable_prometheus_stack }}" \
            -auto-approve \
            -no-color \
            | tee destroy_output.txt

      # ── Summary ───────────────────────────────────────────────────────────────
      - name: Job Summary
        if: always()
        run: |
          echo "## Terraform Deploy — ${{ inputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Owner**  : ${{ secrets.AZURE_OWNER }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch** : ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor**  : @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

          OUTPUT_FILE="${{ inputs.action }}_output.txt"
          if [ -f "$OUTPUT_FILE" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details><summary>Terraform ${{ inputs.action }} output</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 20 "$OUTPUT_FILE" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "_No output captured — the ${{ inputs.action }} step likely failed before producing any._" >> $GITHUB_STEP_SUMMARY
          fi
